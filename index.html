<!DOCTYPE html>
<html>
 <head> 
 <title>A-Frame Primitives</title> 
<script src= "https://aframe.io/releases/1.7.0/aframe.min.js"> </script>
</head>
<body> 
    <a-scene> 
        <a-box
        color="aqua"
        position="-5 5 -8"
        rotation="0 45 0"
        width="2"
        height="2"
        depth="2">
        </a-box>
        <a-cone
        color="maroon"
        position="-5 10 -8"
        rotation="-45 0 0"
        radius-bottom="0.75"
        height="5">
        </a-cone>
        <a-text
        value="Tayvon Thomson" 
        color="green"
        position="2 5 -8"
        width="100">
        </a-text>
        <a-sky
        color="skyblue">
        </a-sky>
         <a-sphere
        color="purple"
        position="0 5 -8"
        radius="3.5">
         </a-sphere>
        <a-cylinder
    color="lime"
    position="20 3 -4"
    rotation="25 0 0"
    radius="1"
    height="3">
        </a-cylinder>
        <a-plane
        color="purple"
        position="0 0 -8"
        rotation="0 0 0"
        width="4"height="4">
    </a-plane>
    </a-scene>
</body>
</html>
